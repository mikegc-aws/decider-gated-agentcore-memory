[project]
name = "decider-memory"
version = "0.1.0"
description = "Proof of concept: a decision model gating AgentCore Memory retrieval for Strands agents"
requires-python = ">=3.11"
dependencies = [
    "strands-agents",
    "bedrock-agentcore",
    "boto3",
    "httpx",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
